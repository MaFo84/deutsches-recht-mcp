[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deutsches-recht-mcp"
version = "1.0.0"
description = "MCP-Server für deutsche Gesetze und Rechtsprechung (NeuRIS, Open Legal Data)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
deutsches-recht-mcp = "deutsches_recht_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
